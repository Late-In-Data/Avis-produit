name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_pipeline:
        description: Télécharger les données et tester le pipeline complet
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Pipeline complet à la demande
        if: github.event_name == 'workflow_dispatch' && inputs.full_pipeline
        run: |
          python scripts/prepare_data.py
          python scripts/train.py
          python scripts/evaluate_robustness.py
          python scripts/prepare_review.py
          python scripts/summarize_review.py
          python -m pytest -q
