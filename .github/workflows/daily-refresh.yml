name: Actualisation quotidienne
on:
  schedule:
    - cron: '15 7 * * *'
      timezone: Europe/Paris
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - name: Cache Amazon et modèles — aucune donnée Reddit
        uses: actions/cache@v4
        with:
          key: amazon-models-${{ runner.os }}-${{ hashFiles('requirements-lock.txt', 'scripts/prepare_data.py', 'scripts/train.py', 'scripts/extract_topics.py', 'sentiment/data.py', 'sentiment/topics.py') }}
          path: |
            data/raw/finefoods.txt.gz
            data/processed/reviews.parquet
            data/processed/topic_assignments.parquet
            models/sentiment.joblib
            models/topics.joblib
            reports/topics.json
      - name: Collecter si configuré et recalculer les agrégats
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT: ${{ secrets.REDDIT_USER_AGENT }}
          REDDIT_ACCESS_APPROVED: ${{ vars.REDDIT_ACCESS_APPROVED }}
        run: python scripts/refresh_daily.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portfolio/dist
      - uses: actions/deploy-pages@v4
        id: deployment
